comparison_acceptance:
  required_zero_mismatches:
    - full_state_digest_each_action
    - ordered_domain_event_digest_each_action
    - red_player_view_canonical_bytes
    - black_player_view_canonical_bytes
    - red_visible_event_prefix_canonical_bytes
    - black_visible_event_prefix_canonical_bytes
    - authorized_visible_error_semantics
    - action_preview_canonical_bytes_and_order
    - authoritative_replay_final_state_and_event_digest
    - observer_replay_frames_equal_live_observer_dtos
  hidden_equivalence_required_pairs:
    - HIDDEN-FLAG-PAIR
    - HIDDEN-HORSE-PAIR
    - HIDDEN-ELEPHANT-PAIR
    - HIDDEN-CANNON-PAIR
    - HIDDEN-RNG-PAIR
    - PRIVATE-MARKER-PAIR
  tamper_policy: normal_manifest_exit_0_and_forced_tamper_nonzero
  golden_update_policy: forbidden_without_rules_or_contract_change_review

full_1000_seed_rerun_triggers:
  mode: any_trigger_requires_full_rerun
  triggers:
    - change_to_domain_rule_or_settlement_code
    - change_to_seeded_random_algorithm_state_or_draw_order
    - change_to_match_initialization_configuration_or_flag_generation
    - change_to_full_state_domain_event_or_canonical_codec_fields_types_order_or_normalization
    - change_to_replay_capture_decode_or_execution_order
    - change_to_projection_visibility_player_view_visible_event_visible_error_or_action_preview
    - change_to_any_rules_and_information_baseline_or_r2_remediation_sha256
    - any_mismatch_in_smoke_replay20_known_regression_or_hidden_equivalence
  required_result:
    completed: 1000
    failures: 0
    determinism_mismatches: 0
    replay_verified: 20
    cross_implementation_mismatches: 0
    manifest_normal_exit_code: 0
    manifest_forced_tamper_exit_code: nonzero

failure_return:
  on_any_mismatch:
    stop_current_slice: true
    do_not_start_next_iteration: true
    preserve:
      - rc3_candidate_and_historical_manifests
      - failing_seed_and_normalized_intent_prefix
      - first_mismatching_channel_and_action_index
      - old_and_new_canonical_bytes_and_digests
      - replay_and_hidden_pair_minimal_reproduction
    return_to: responsible_ITERATION-1_or_ITERATION-2_technical_task
  rules_or_information_difference:
    return_to: pos:veilfront-xiangqi-siege:design-experience:systems-experience-lead
    escalation: project_manager_then_project_owner_if_semantics_change
  codec_or_architecture_difference:
    return_to: pos:veilfront-xiangqi-siege:technology:godot-technical-lead
  forbidden_recovery:
    - edit_rc3_historical_evidence
    - bless_new_digest_only_to_make_test_pass
    - skip_red_or_black_observer_channel
    - expose_full_state_raw_event_seed_or_authoritative_replay_to_consumer

scope_guard:
  forbidden:
    - runtime_implementation_during_REM-G2-R2-002
    - internet_or_steam_networking
    - external_service_or_server_purchase
    - ai_delivery_or_training
    - bulk_final_art_production
    - contract_registry_approval_or_gate_mutation
  next_legal_action: REM-G2-R2-003_final_dual_re_review_of_exact_artifact_sha256_set
