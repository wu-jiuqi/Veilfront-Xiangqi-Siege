codec_bindings:
  canonical_algorithm:
    source_name: gate1_canonical_json_sha256_v1
    source_commit: 6253678157157091584b253470e709bad17c534f
    source_path: scripts/prototype/core/canonical.gd
    rules: recursive_string_key_sort_array_order_preserved_vector2i_as_two_int_array_json_sha256
    target_name: veilfront_canonical_json_sha256_v1
  channels:
    - channel: full_state
      source_codec: full-state-v1
      source_digest_codec: state-summary-v1
      target_codec: veilfront-full-state-v1
      compare: canonical_sha256_each_action_including_rng_checkpoint
    - channel: domain_event
      source_codec: gate1-action-events-canonical-v1-implicit
      source_schema_implicit: true
      target_codec: veilfront-domain-event-v1
      compare: canonical_sha256_of_ordered_event_prefix_each_action
    - channel: red_player_view
      source_codec: player-view-v1
      target_codec: veilfront-player-view-v1
      viewer: red
      compare: canonical_bytes_each_action
    - channel: black_player_view
      source_codec: player-view-v1
      target_codec: veilfront-player-view-v1
      viewer: black
      compare: canonical_bytes_each_action
    - channel: red_visible_event
      source_codec: player_events_within_player-view-v1
      source_schema_implicit: true
      target_codec: veilfront-visible-event-v1
      viewer: red
      compare: canonical_bytes_of_visible_prefix_each_action
    - channel: black_visible_event
      source_codec: player_events_within_player-view-v1
      source_schema_implicit: true
      target_codec: veilfront-visible-event-v1
      viewer: black
      compare: canonical_bytes_of_visible_prefix_each_action
    - channel: visible_error
      source_codec: prototype-public-error-shape-v1-implicit
      source_schema_implicit: true
      target_codec: veilfront-visible-error-v1
      compare: mapped_public_semantics_and_hidden_pair_byte_equality
    - channel: action_preview
      source_codec: action-preview-v1
      target_codec: veilfront-action-preview-v1
      compare: canonical_bytes_and_order_for_same_player_view
    - channel: authoritative_replay
      source_codec: prototype-replay-v1
      target_codec: veilfront-authoritative-replay-v1
      compare: intents_execution_results_events_and_final_state_digest
    - channel: observer_replay
      source_codec: none_new_formal_projection
      target_codec: veilfront-observer-replay-v1
      compare: frame_bytes_equal_live_player_view_visible_event_visible_error_action_preview

