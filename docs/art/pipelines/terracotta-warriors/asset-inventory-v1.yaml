    - GATE-2项目所有者批准
    - 新批量生产Contract
    - 预算、工期与制作方式确认
    - 独立QA前置条件
  style_rules:
    character_language: 金属兵马俑、秦俑体态、层叠札甲、全身金属化
    face: 光滑无五官曲面面具
    red_faction: 高明度银白钨钢、浅中灰钢底、蓝灰反射、清晰冷色金属高光、小面积暗朱系绳
    black_faction: 深墨绿青铜、近黑绿凹面、少量铜绿、清晰但克制的青铜磨边高光
    gold_usage: 目标、军令、关键纹章与七兵种职位字
    role_glyphs: [兵, 炮, 车, 马, 相, 士, 将]
    role_designs:
      兵: 盾矛重步兵；金字位于盾面
      炮: 中国早期牵引式抛石机；A形架、长臂柔性吊索石袋、短端多根人力牵引绳；金字位于机架铭牌；禁止刚性石勺、欧洲配重箱与火炮
      车: 奔行三马秦战车与显著高旗；金字位于旗面
      马: 冲锋或半扬蹄秦骑兵与甲马；金字位于马胸牌或鞍侧短旗
      相: 秦朝文官、高冠与笏板；金字位于笏板
      士: 秦朝侍女、端庄侍立；金字位于腰佩或礼牌
      将: 高冠主将、宽站姿与举起的将剑/长戈；金字位于胸牌或将印
    prohibited:
    - 陶土或石像质感
    - 塑料质感
    - 大面积布甲
    - 只换色不换轮廓
    - 未校对或无授权的正式小篆字体资产
