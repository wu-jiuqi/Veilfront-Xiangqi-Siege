  runtime_specifications:
    board_authority_grid: 9×24 intersections; authority coordinates X=1..9/Y=1..24
    current_board_background: v7_low_noise PNG through BoardMapOption
    piece_baseline: 14 round token PNGs; 7 roles × 2 factions
    observer_boundary: 仅由PlayerView决定可见节点、旗位、迷雾与反馈，不允许表现层读取隐藏FullState
    fixed_structure: 正式壳优先使用预置Control/Node2D、Sprite2D和预置子场景
    target_resolutions: [960×540, 1280×720, 1920×1080]
    deferred_quality_work: 完整动画、完整音频、全量VFX、最终UI皮肤和正式小篆矢量母版

  dependencies:
  - DELIVERABLE-PRESENTATION-2D-001提供正式二维场景、坐标映射与PlayerView绑定。
  - DELIVERABLE-QA-2D-001必须从clean worktree复现三分辨率、双方视角、层级、信息安全与性能证据。
  - GATE-2审美与可读性判断由project-owner保留；本清单和生产者自检不能代替批准。

  acceptance:
  - 只消费PlayerView，未授权棋子和旗位不创建节点。
  - 红黑180度映射不改变权威坐标。
  - 960×540、1280×720、1920×1080可读且不裁切；当前仍待以GATE-2候选提交重新捕获证明。
  - 规则、回放、随机消费与教学语义保持不变。
  - 样片、局部实现、资源参考与GATE-2后批量项必须保持分栏，不以资源存在冒充完整生产。

  cost_unknowns:
  - 二维棋子最终角色化立绘/棋盘小图是否继续双资产制，以及14角色后续状态、表情和动画帧数量。
  - 三目标分辨率可读性修订对HUD重排、字体授权、九宫格切片和手柄焦点适配的工时。
  - 攻击、占领、修复、结算VFX的cue数量、变体数、粒子预算与低配降级规格。
  - BGM/SFX数量、原创或授权来源、循环点、混音、总线和外包成本。
  - 城墙是否继续使用单纹理程序化状态，或在GATE-2后生产红黑各自三状态正式美术。
  - 旗帜是否需要发现/未发现过渡动画；任何过渡不得泄露未授权旗位。
  - 后期是否重新启动三渲二研究，以及由此产生的独立成本和性能预算。

  unresolved:
  - 当前GATE-2候选提交的960×540、1280×720、1920×1080双方视角样片尚未成套归档。
  - HUD与教程正文在低分辨率下的可读性仍需修订和人工判断。
  - 当前工作区非clean；最终状态与截图必须绑定冻结提交和构建。
  - 完整动画、音频、VFX与最终UI须在GATE-2通过后另立Contract，不属于本交付完成声明。

  deferred_research_assets:
