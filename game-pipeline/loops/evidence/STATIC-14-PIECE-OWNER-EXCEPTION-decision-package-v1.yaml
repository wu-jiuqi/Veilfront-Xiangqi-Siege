    source_and_runtime_pipeline:
    - 纯紫幕源图生成或编辑，不以灰色背景直接抠图。
    - 从紫幕源执行色键，输出真实RGBA并处理半透明边缘紫边。
    - 人形运行时纹理为512×768；炮、车、马为768×768；禁止非等比拉伸。
    - Godot导入启用VRAM Compressed、mipmap和Fix Alpha Border。
    test_scene_integration:
      scene: scenes/dev/art/piece_art_test_3d.tscn
      instance_count: 32
      formation_per_faction: 5兵、2炮、2车、2马、2相、2士、1将
      purpose: 仅用于美术尺寸、锚点、遮挡、阵营和轮廓审查，不接管规则事实。
  approval_effect:
    allowed:
    - 将上述14张既有运行时纹理、14个既有棋子预置和32实例测试场保留为GATE-2前美术测试资产与证据。
    - 继续执行机械校验、Godot导入校验、尺寸/锚点/透明边缘修复以及测试场内可读性审查。
    - 在不新增角色、姿态、动作帧或视觉设计的前提下，修复命名、导入参数、透明边缘、锚点和显示尺寸。
    - 在资产清单中把本例外标记为项目所有者批准的有限例外，但不得标记GATE-2已通过。
    forbidden:
    - 把“兵马俑”提升为项目全局美术风格。
    - 新增或重做棋子造型、姿态、动作帧、头像、皮肤、受损差分或其他批量美术资产。
    - 制作或批准完整UI、VFX、动画、音频、环境资产及任何高成本外包。
    - 把当前生成式金色职位字视为经字源校对和授权的正式秦小篆矢量母版。
    - 接入正式对局规则、修改PlayerView、回放、随机消费、教学语义或批准GATE-2。
    - 将本次追认描述为2026-08-20批量制作之前已经存在的授权。
