  acceptance_and_residual_risk:
    observed_passes:
    - 14张运行时PNG均为RGBA，尺寸与命名通过机械校验，边角Alpha为0且未检出紫边。
    - 14个棋子预置和32实例测试场可由Godot 4.7.1解析并无头加载。
    - 红方银白钨钢、黑方深墨绿青铜及七角色轮廓已形成可审查差异。
    unresolved:
    - 正式96px盘内可读性、三目标分辨率、双方180°视角、遮挡和色觉弱化仍需独立QA。
    - 七个正式秦小篆职位字仍需字源校对、同系列矢量重绘和授权记录。
    - 炮、车、马方形源为1254×1254，低于1536×1536目标，不得冒充原生1536细节。
    - 本例外不能把任何未通过的自动检查或GATE-2人工判断改写为通过。
  decision_consequences:
    approved: 创建符合game-production-approval/v1且绑定本摘要哈希的批准记录；既有资产可按approval_effect有限留存、验证和测试接入。
    rejected: 不创建批准记录；既有资产只保留为越界生产的历史证据，不得作为已批准生产基线，后续处置另请项目所有者决定。
    revise: 根据项目所有者指出的范围修改本摘要，生成新哈希并重新请求确认；旧哈希立即失效。
