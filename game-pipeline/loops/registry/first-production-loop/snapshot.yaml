storage_contract:
  authoritative_history: event_history
  snapshot_role: 可由完整事件历史重建的当前物化视图
  artifact_storage: Registry 仅保存带版本和摘要的引用，不保存产物正文
  transaction_rule: 一个 mutation_id 对应恰好一个 Event；Event 追加和 Snapshot 更新必须原子完成。
  registration_baseline: Snapshot 首次持久化必须与 sequence=1 的 core.loop_registered 同时完成，record_revision=1。
  topology_rules:
    - parent_loop_id 与 dependency.target_loop_id 不得等于当前 loop_instance_id。
    - 父 Loop 图必须无环；不在父 Snapshot 中重复保存 child_loop_ids。
    - 同一依赖关系不得重复；所有 blocking=true 的依赖图必须无环。

