loop_contract:
  schema_version: '0.2'
  contract_id: LOOP-CTR-FORMAL-FOUNDATION-GATE2-001
  loop_type: formal-architecture-tutorial-visual-baseline
  title: 第二生产循环v2——斜俯视三维表现successor与视觉样片
  version: 2
  status: draft
approval_binding: null
draft_review:
  status: awaiting_project_owner_approval
  prepared_against:
    project_brief_version: 6
    project_brief_subject_digest: 54520517ac26859c24459accb2d7672d12d0224ef69a766f883eda7b2b523289
    project_brief_confirmation: confirmed
    project_brief_approval_id: approval:veilfront-xiangqi-siege:project-brief:54520517ac26
    previous_contract_version: 1
    previous_contract_approval_id: approval:veilfront-xiangqi-siege:loop-contract:9beb91baa720
    current_registry_loop_id: 83c995ff-37b9-4df8-9e84-8417d6632187
    current_registry_revision: 23
  note: 本草案只修订受新视觉方向影响的表现、样片和复核范围；批准前不得迁移Registry、修改正式场景或启动样片制作。
purpose:
  objective: 在保留GATE-2 v1已经接受的正式规则核心、PlayerView边界、回放与教学成果的前提下，以24×9一基交点、Node3D三维棋盘、Sprite3D角色和锁定低FOV斜俯视摄像机建立正式表现successor，完成少量可审查视觉样片、完整资产清单和独立QA，为GATE-2人工审查提供新证据；不启动高成本批量美术。
  preserved_deliverables:
  - deliverable_id: DELIVERABLE-ARCH-001
    version: iteration1
    preserve_as: 规则、DTO、依赖与信任边界基线；二维表现映射由successor取代
  - deliverable_id: DELIVERABLE-MIGRATION-001
    version: r3-owner-exception
    preserve_as: 正式规则核心与迁移等价证据
  - deliverable_id: DELIVERABLE-TUTORIAL-001
    version: current-iteration3
    preserve_as: 教学Intent/Event与固定流程事实；只适配新的表现容器
  required_deliverables:
  - deliverable_id: DELIVERABLE-PRESENTATION-3D-001
    artifact_type: preset-godot-oblique-3d-match-shell
    description: 以预置Node3D、Camera3D、Sprite3D、单一迷雾mask和CanvasLayer UI组成的正式表现successor，并保持一基坐标、双方底部视角和PlayerView边界。
  - deliverable_id: DELIVERABLE-ART-001
    artifact_type: demo-visual-baseline-and-asset-inventory
    description: 已冻结视觉基线、目标分辨率游戏内样片、完整Demo资产清单、规格、依赖、验收标准与成本未知项。
  - deliverable_id: DELIVERABLE-QA-002
    artifact_type: independent-gate2-v2-evidence
    description: 对场景预置、坐标映射、透明排序、遮挡、迷雾泄露、响应式布局、性能和旧行为回归的独立证据。
  - deliverable_id: DELIVERABLE-GATE2-001
    artifact_type: human-decision-package
    description: 绑定Brief v6、三维表现successor、视觉样片、资产清单、构建和独立QA摘要的GATE-2人工决策包。
  out_of_scope:
  - Steam Networking、互联网Relay、专用服务器、匹配、账号、重连、观战、聊天和部署运维实现。
  - AI训练、AI质量提升、AI难度调参和首版Demo的人机对战交付。
  - GATE-2前批量制作十四类棋子完整动画、完整音频、全量特效、最终UI皮肤或签署高成本外包承诺。
  - 修改owner rule revision 5、确定性随机消费、回放摘要、PlayerView信息边界或教学Intent/Event语义。
  - 删除或重写v1历史证据；旧二维表现只能标记为superseded，不能伪装成从未存在。
responsibility:
  owner_role: pos:veilfront-xiangqi-siege:root:project-manager
  producer_roles:
  - pos:veilfront-xiangqi-siege:technology:godot-technical-lead
  - pos:veilfront-xiangqi-siege:design-experience:systems-experience-lead
  - pos:veilfront-xiangqi-siege:design-experience:visual-production-lead
  reviewer_roles:
  - pos:veilfront-xiangqi-siege:quality:qa-release-lead
  - project-owner
  required_authority_scope:
  - AUTH-VEILFRONT-PROJECT-MANAGER
  - AUTH-VEILFRONT-GODOT-TECHNOLOGY
  - AUTH-VEILFRONT-SYSTEMS-EXPERIENCE
  - AUTH-VEILFRONT-VISUAL-PRODUCTION
  - AUTH-VEILFRONT-QA-RELEASE
  - GATE-2由project-owner保留
  escalation_to: project-owner
start:
  triggers:
  - trigger_id: TRIGGER-BRIEF-V6-CONFIRMED
    description: Project Brief v6确认且不可变批准摘要匹配。
  - trigger_id: TRIGGER-CONTRACT-V2-APPROVED
    description: 本Contract v2精确摘要由项目所有者另行批准。
  - trigger_id: TRIGGER-REGISTRY-MIGRATION-READY
    description: 当前active Registry已形成保留历史、更新Contract绑定和输入工件的迁移计划。
  entry_conditions:
  - condition_id: ENTRY-INSTANCE-NORMAL
    description: 项目实例、插件锁、Organization Registry、权限和生成Agent适配器为normal。
    required_evidence: validate_project_instance.py退出码0。
  - condition_id: ENTRY-BRIEF-V6-CONFIRMED
    description: Brief v6处于confirmed且approval摘要为54520517ac26859c24459accb2d7672d12d0224ef69a766f883eda7b2b523289。
    required_evidence: project-brief validator带approval-dir退出码0。
  - condition_id: ENTRY-CONTRACT-V2-APPROVED
    description: v2不可变approval与物化文件摘要一致。
    required_evidence: game-pipeline/approvals下v2 approval。
  - condition_id: ENTRY-PREVIOUS-EVIDENCE-PRESERVED
    description: v1 Registry事件历史、已接受产物和失败/例外记录保持可验证，迁移不得重写历史。
    required_evidence: validate_loop_registry.py退出码0及迁移前后快照。
  required_inputs:
  - input_slot_id: INPUT-BRIEF-V6-001
    artifact_type: confirmed-project-brief
    version_requirement: version 6；subject_digest=54520517ac26859c24459accb2d7672d12d0224ef69a766f883eda7b2b523289；approval=approval:veilfront-xiangqi-siege:project-brief:54520517ac26。
    required: true
  - input_slot_id: INPUT-REGISTRY-V1-001
    artifact_type: active-loop-registry-snapshot
    version_requirement: LOOP-GATE2-001 revision 23或经校验的后继revision；保留所有历史事件。
    required: true
  - input_slot_id: INPUT-VISUAL-BASELINE-001
    artifact_type: owner-frozen-oblique-3d-visual-baseline
    version_requirement: docs/art/veilfront-visual-baseline-v1.md与变更影响记录一致。
    required: true
  - input_slot_id: INPUT-ASSET-INVENTORY-001
    artifact_type: demo-art-asset-inventory
    version_requirement: docs/art/demo-asset-inventory-v1.yaml覆盖CHECK-ART-001全部类别。
    required: true
  - input_slot_id: INPUT-PREVIOUS-ACCEPTED-001
    artifact_type: gate2-v1-accepted-deliverables
    version_requirement: Registry已登记的ARCH、PRESENTATION、MIGRATION和QA产物；二维表现仅作为历史灰盒证据。
    required: true
iterations:
  - iteration_id: ITERATION-3R-OBLIQUE-3D-VISUAL
    objective: 建立三维表现successor并制作最小视觉样片，不改规则核心与教学语义。
    owner_role: pos:veilfront-xiangqi-siege:design-experience:visual-production-lead
    tasks:
    - task_id: TASK-PRESENTATION-3D-001
      description: 修订正式Godot场景组合，以预置Node3D/Camera3D/Sprite3D、单一9×24迷雾mask、CanvasLayer UI和一基坐标mapper实现最小可加载三维表现壳。
      owner_role: pos:veilfront-xiangqi-siege:technology:godot-technical-lead
      output_refs:
      - DELIVERABLE-PRESENTATION-3D-001
    - task_id: TASK-ART-001
      description: 按视觉基线和样片任务书完成棋盘、网格、红黑步兵/骑兵、城墙三状态、旗帜、迷雾、选择/落点/攻击反馈和UI局部样片，不启动全量生产。
      owner_role: pos:veilfront-xiangqi-siege:design-experience:visual-production-lead
      output_refs:
      - DELIVERABLE-ART-001
    - task_id: TASK-TUTORIAL-3D-COMPAT-001
      description: 证明现有教学仍通过同一Intent/Event运行并能绑定三维表现容器；不得复制规则或重写教学事实。
      owner_role: pos:veilfront-xiangqi-siege:design-experience:systems-experience-lead
      output_refs:
      - DELIVERABLE-PRESENTATION-3D-001
      - DELIVERABLE-QA-002
  - iteration_id: ITERATION-4-V2-INDEPENDENT-REVIEW
    objective: 独立复核三维表现、视觉样片、旧行为回归、信息边界和Contract范围。
    owner_role: pos:veilfront-xiangqi-siege:quality:qa-release-lead
    tasks:
    - task_id: TASK-QA-V2-001
      description: 从clean worktree执行项目/Registry/场景/回归检查，并复现三分辨率、双方视角、遮挡、透明排序、迷雾泄露和性能证据。
      output_refs:
      - DELIVERABLE-QA-002
    - task_id: TASK-GATE2-V2-001
      description: 汇总绑定提交、构建、视觉样片、资产清单与独立QA的GATE-2决策包，不代替项目所有者批准。
      owner_role: pos:veilfront-xiangqi-siege:root:project-manager
      output_refs:
      - DELIVERABLE-GATE2-001
acceptance:
  automated_checks:
  - check_id: CHECK-CONTRACT-V2-001
    description: Brief v6、Contract v2 approval、Registry迁移、组织权限、Git提交和证据摘要全部匹配。
    required: true
  - check_id: CHECK-DEPENDENCY-001
    description: domain/application/PlayerView信任边界不因三维表现发生反向依赖。
    required: true
  - check_id: CHECK-INFORMATION-V2-001
    description: 未授权敌棋和旗位不创建节点；迷雾、镜头、音效、粒子、碰撞体和合法落点均不能泄露隐藏信息。
    required: true
  - check_id: CHECK-GODOT-3D-001
    description: Godot 4.7.1无错误导入；正式主壳、对局壳、三维表现壳和教学场景可无头加载；固定结构遵守预置节点优先。
    required: true
  - check_id: CHECK-COORDINATE-001
    description: 红黑视角下X=1..9/Y=1..24权威坐标、交点点击和180°表现映射保持一致，九路完整显示。
    required: true
  - check_id: CHECK-VISUAL-READABILITY-001
    description: 960×540、1280×720、1920×1080下前后排可读、透明排序稳定、棋子不连续遮住两个以上交点、HUD与高亮不裁切。
    required: true
  - check_id: CHECK-PERFORMANCE-001
    description: Forward+目标样片记录纹理规格、显存估算和帧率；关闭高级后处理时核心可读性仍成立。
    required: true
  - check_id: CHECK-ART-001
    description: 资产清单覆盖棋盘、棋子、城墙、迷雾、旗帜、UI、特效、动画和音频，并区分预制作样片与GATE-2后批量项。
    required: true
  - check_id: CHECK-REGRESSION-001
    description: 代表性规则、PlayerView、回放和教学回归通过；三维表现不得改变随机消费或权威状态摘要。
    required: true
  - check_id: CHECK-SCOPE-001
    description: 未引入互联网SDK、服务器、AI交付、高成本批量资产或外包承诺。
    required: true
  professional_review:
    required: true
    reviewer_role: pos:veilfront-xiangqi-siege:quality:qa-release-lead
    criteria:
    - 生产者不是自己交付物的唯一审查者，QA在clean worktree复现关键证据。
    - 三维表现successor没有静默修改规则、教学语义、PlayerView或随机序列。
    - 视觉样片足以判断可读性、风格和生产成本，但没有冒充完整美术。
    - 旧二维证据保留且明确标记适用边界。
  human_gate:
    required: true
    gate_id: GATE-2
    question: 斜俯视三维表现successor、教学灰盒、信息边界与视觉样片是否足够稳定，值得进入Demo级批量资产生产？
  success_conditions:
  - 所有必要自动检查和独立专业审查通过。
  - 三维表现不依赖AI和LAN原型，且不改变正式规则/PlayerView/Replay边界。
  - 三目标分辨率、双方视角、透明排序、遮挡和迷雾安全证据可复现。
  - 视觉样片与完整资产清单足以判断质量方向和产能风险。
  - GATE-2只进入awaiting_human，任何Agent不得代替项目所有者批准。
state_machine:
  state_machine_id: LOOP-SM-DEFAULT
  version: '0.2'
  allowed_overrides: []
failure_and_exit:
  blocking_conditions:
  - Brief v6或Contract v2未批准、摘要不匹配、Registry迁移未验证或项目实例非normal。
  - 三维表现必须读取隐藏FullState、创建未授权节点或修改规则/随机/回放才能工作。
  - 样片无法在冻结校准带内解决前后遮挡、透明排序、九路显示或交点点击。
  - 视觉基线不足以形成可估算资产清单，或需要未经批准的高成本生产。
  - 任一必要自动检查失败且修订预算不足。
  rollback:
    return_to: TASK-PRESENTATION-3D-001或TASK-ART-001；方向性失败返回Project Brief/Contract审批。
    preserve:
    - v1 Registry历史、已接受架构/迁移/教学证据和所有失败记录。
    - Brief v6、视觉基线、资产清单、样片源文件和三分辨率证据。
    - 失败的遮挡、排序、迷雾与性能最小复现。
  cancellation_conditions:
  - 项目所有者取消斜俯视三维方向或再次改变Demo范围。
  - 证据证明冻结边界内不可行且项目所有者选择停止而非修订。
  final_handoff:
    receiver_role: pos:veilfront-xiangqi-siege:root:project-manager
    required_contents:
    - v1保留产物、三维表现successor和迁移影响映射。
    - 教学回归、PlayerView信息边界、场景加载、分辨率、遮挡、排序和性能证据。
    - Demo视觉基线、样片、完整资产清单及成本未知项。
    - GATE-2人工决定范围与批量生产前置条件。
coordination:
  allowed_parent_loop_types:
  - project-production
  dependency_rules:
  - Brief v6必须先获项目所有者确认，本Contract v2再以最终摘要单独获批。
  - Contract批准后必须先迁移Registry绑定，未迁移前不得执行TASK-PRESENTATION-3D-001或TASK-ART-001。
  - 技术负责人拥有三维场景与渲染映射，视觉负责人拥有视觉基线和样片，系统体验负责人拥有教学事实；不得互相静默修改事实源。
  - QA保持独立，不拥有生产事实源或GATE-2批准权。
  - 互联网实现、服务器采购和批量美术生产必须等待GATE-2结果及新的获批生产Contract。
  child_loop_creation:
    allowed: false
    conditions: []
    required_authority_scope: []
  registry_binding:
    store_runtime_relationships_in_registry: true
