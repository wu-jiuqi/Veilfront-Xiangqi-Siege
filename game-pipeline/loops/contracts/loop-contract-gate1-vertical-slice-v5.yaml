loop_contract:
  schema_version: '0.2'
  contract_id: LOOP-CTR-GATE1-VERTICAL-SLICE-001
  loop_type: gate1-risk-retirement-vertical-slice
  title: 首个生产循环——规则、迷雾与 AI 公平性垂直切片
  version: 5
  status: approved
approval_binding:
  approval_id: approval:veilfront-xiangqi-siege:loop-contract:d88d9017bb30
  subject_digest: d88d9017bb30437ac480e0fcf4f7b262b5ae6b3427447946e50ec37a5d3b44ca
  approved_by: project-owner
  approved_at: '2026-08-17T21:53:52.382912+08:00'
  source_ref: codex-thread://current#owner-rule-revision-5
purpose:
  objective: 在不投入正式功能架构与资产生产的前提下，用一个可丢弃、可重复验证的 Godot 4.7.1 逻辑垂直切片验证《雾疆：九路烽棋》的核心循环、复杂结算顺序、 战争迷雾信息边界、确定性随机与只读取玩家等价可见信息的单机 AI
    是否共同成立，并以可丢弃的局域网真人测试工具补充双人对战体验证据，为 GATE-1 提供独立证据。
  required_deliverables:
  - deliverable_id: DELIVERABLE-RULES-001
    artifact_type: executable-rules-spec
    description: 版本化规则规格、状态集合、合法行动定义与结算优先级。
  - deliverable_id: DELIVERABLE-INFO-001
    artifact_type: information-boundary-contract
    description: 玩家视角迷雾投影、可见事件与 AI 输入权限契约。
  - deliverable_id: DELIVERABLE-GODOT-001
    artifact_type: disposable-godot-prototype
    description: 可从种子开局运行至胜负或轮数上限结算的 Godot 4.7.1 逻辑原型，并可附带不承诺正式架构的局域网真人测试工具。
  - deliverable_id: DELIVERABLE-AI-001
    artifact_type: auditable-baseline-ai
    description: 仅依赖玩家等价可见投影的基线机器人、预算参数与决策审计日志。
  - deliverable_id: DELIVERABLE-QA-001
    artifact_type: independent-gate-evidence
    description: 独立规则矩阵、确定性回放、信息泄露审计、AI 公平性与批量对局证据。
  - deliverable_id: DELIVERABLE-GATE1-001
    artifact_type: human-decision-package
    description: 绑定当前产物摘要的 GATE-1 人工决策包。
  out_of_scope:
  - 正式美术、动画、音频、UI 皮肤与批量资产生产。
  - 面向发布的正式架构冻结、性能优化、存档兼容和 Steam 导出。
  - 面向发布的互联网联机、排位、NAT 穿透、房主迁移、专用服务器、机器学习 AI；本合同单独批准的可丢弃局域网真人测试工具除外。
  - 在原型证据形成前冻结单局轮数上限、AI 搜索预算、决策随机性或难度档位。
  - 将可丢弃原型代码直接认定为正式功能实现。
responsibility:
  owner_role: pos:veilfront-xiangqi-siege:root:project-manager
  reviewer_roles:
  - pos:veilfront-xiangqi-siege:design-experience:systems-experience-lead
  - pos:veilfront-xiangqi-siege:technology:godot-technical-lead
  - pos:veilfront-xiangqi-siege:quality:qa-release-lead
  - project-owner
  required_authority_scope:
  - AUTH-VEILFRONT-PROJECT-MANAGER
  - AUTH-VEILFRONT-SYSTEMS-EXPERIENCE
  - AUTH-VEILFRONT-GODOT-TECHNOLOGY
  - AUTH-VEILFRONT-SINGLE-PLAYER-AI
  - AUTH-VEILFRONT-QA-RELEASE
  - GATE-1 由 project-owner 保留
  escalation_to: project-owner
start:
  triggers:
  - trigger_id: TRIGGER-CONTRACT-APPROVED
    description: 项目所有者批准本 Loop Contract 与绑定的 CTR-P1-001 v1。
  entry_conditions:
  - condition_id: ENTRY-INSTANCE-NORMAL
    description: 项目实例校验为 normal，插件锁、组织 Registry 和生成 Agent 适配器无错误。
    required_evidence: validate_project_instance.py 的退出码 0 与输出记录。
  - condition_id: ENTRY-CONTRACT-APPROVED
    description: Loop Contract 与垂直切片 Contract 已由项目所有者批准，摘要与待执行版本一致。
    required_evidence: game-pipeline/approvals/ 下的不可变 approval 记录。
  - condition_id: ENTRY-NO-PRODUCTION-BEFORE-APPROVAL
    description: 批准前不得创建 project.godot、游戏源代码、场景、资源或资产。
    required_evidence: 批准前 Git 基线与 Contract 审批记录。
  - condition_id: ENTRY-INDEPENDENT-QA
    description: QA 审查实例与规则、技术、AI 生产实例相互独立。
    required_evidence: Organization Registry 任命与实例记录。
  required_inputs:
  - input_slot_id: INPUT-BRIEF-001
    artifact_type: confirmed-project-brief
    version_requirement: version 4，subject_digest=df8deb810d8c06c8c2f5763031fde2c39f14aa81226e23ffb25636ee3f1eca0b，approval=approval:veilfront-xiangqi-siege:project-brief:df8deb810d8c
    required: true
  - input_slot_id: INPUT-ORG-001
    artifact_type: approved-organization-snapshot
    version_requirement: organization_revision 2，snapshot_digest=9b193d9d99f7a541edc5aa5b285ee98127fb7684f4ee47e6b06c7c413a4c7fe9
    required: true
  - input_slot_id: INPUT-WORK-CTR-001
    artifact_type: approved-pipeline-contract
    version_requirement: CTR-P1-001 version 1，摘要与批准记录一致
    required: true
iteration:
  task_sequence:
  - task_id: TASK-SPEC-001
    responsible_role: pos:veilfront-xiangqi-siege:design-experience:systems-experience-lead
    action: 固化不改变已确认语义的可执行规则、状态、结算顺序、玩家行为闭环、迷雾投影与原型观测指标。
    expected_output: 规则规格、结算顺序、信息边界契约和开放问题清单。
  - task_id: TASK-MAP-001
    responsible_role: pos:veilfront-xiangqi-siege:technology:godot-technical-lead
    action: 在实现前记录场景、资源、运行时数据、测试和证据的 Godot 路径映射，并说明所有动态生成例外。
    expected_output: 技术方案与 Godot 场景资源映射。
  - task_id: TASK-PROTOTYPE-001
    responsible_role: pos:veilfront-xiangqi-siege:technology:godot-technical-lead
    action: 创建并实现可丢弃的逻辑原型、种子随机、行动日志、状态摘要、无头测试入口，以及严格受 PlayerView 信息边界约束的局域网真人测试适配器。
    expected_output: 可运行原型、可复现回放与技术验证证据。
  - task_id: TASK-AI-001
    responsible_role: pos:veilfront-xiangqi-siege:technology:single-player-ai-engineer
    action: 只通过 PlayerView 投影接口实现基线 AI，记录输入摘要、预算、候选动作与最终决策。
    expected_output: AI 输入契约、基线机器人、参数和反作弊审计日志。
  - task_id: TASK-QA-001
    responsible_role: pos:veilfront-xiangqi-siege:quality:qa-release-lead
    action: 独立执行规则矩阵、随机性、回放、信息泄露、AI 公平性、边界状态和批量对局验证。
    expected_output: 可复现缺陷、回归结果和 GATE-1 客观证据包。
  - task_id: TASK-GATE1-001
    responsible_role: pos:veilfront-xiangqi-siege:root:project-manager
    action: 在全部必要客观检查通过后整理风险、开放问题与可逆选项，提交项目所有者进行 GATE-1 判断。
    expected_output: 绑定当前证据摘要的 GATE-1 决策请求；不得代替人类批准。
  carry_forward:
  - 已确认项目简报及其事实、假设、未知项标签。
  - 上一轮所有失败证据、随机种子、回放日志、缺陷与 Gate 反馈。
  - 已通过且未受变更影响的测试证据；受影响项必须重检。
  - OWNER-RULE-REVISION-2026-08-17 及其受影响测试必须在最新稳定提交上重检。
  - OWNER-RULE-REVISION-5-2026-08-17、Project Brief v4 及其受影响的规则、PlayerView、AI、LAN、UI 和确定性证据必须在同一冻结候选提交上重检。
  change_summary_required: true
  review_rejection:
    action: revise_same_loop
    increment_iteration: true
    create_new_loop: false
budget:
  iteration_limit: 3
  time_limit: null
  cost_limit: null
  on_exhausted: pause_and_review
acceptance:
  automated_checks:
  - check_id: CHECK-CONTRACT-001
    description: 项目实例、CTR-P1-001 结构与全部 YAML 解析检查通过。
    required: true
  - check_id: CHECK-GODOT-001
    description: Godot 4.7.1 能无错误导入项目，原型主场景、测试入口与局域网测试适配器可无头加载；同机双实例可完成连接和离散行动同步；交点坐标、正方形网格、黑方180°镜像和缩放适配不得改变权威坐标或行动语义。
    required: true
  - check_id: CHECK-RULES-001
    description: CTR-P1-001 中列出的规则、结算优先级和边界测试全部通过且可由固定种子复现。必须覆盖交点落子、Y=4/Y=21墙线及完整墙禁入、普通车接触首枚隐身马、相田字只阻挡敌方车与敌方兵卒、按观察者发现并永久记忆旗位、所有死亡原因进入双方同步公开阵亡记录、士主动献祭的注册/确认/取消及非士非将帅复活候选池。
    required: true
  - check_id: CHECK-DETERMINISM-001
    description: 同一版本、初始状态、随机种子与行动序列的最终状态摘要和事件日志摘要完全一致。
    required: true
  - check_id: CHECK-FOG-001
    description: 隐藏状态不同但指定玩家可见投影相同的配对用例，不产生可区分的合法动作、事件、提示、查询结果或联网下行消息；客户端不得接收 FullState、RNG 内部状态或完整审计。未发现旗位及未触发的敌方相田字阻挡源不得进入
      PlayerView、AI 或联网下行；旗位进入某方视野后只写入该方永久发现记忆。双方阵亡记录公开但不附带未授权死亡坐标；被吃虚影只投影给阵亡方并按时到期；右键标注只存在于本地玩家表现层。
    required: true
  - check_id: CHECK-AI-001
    description: AI 只接收 PlayerView；可见投影、AI记忆与AI种子相同的配对用例产生相同决策与输入审计摘要。AI 只读取己方已发现旗位，不能读取另一方发现记忆或未发现旗位；须合法评估士主动复活、相田字阻挡敌车/敌兵卒、隐身马接触结算和双方公开阵亡记录。
    required: true
  - check_id: CHECK-SIMULATION-001
    description: 至少 1000 个固定种子对局均以合法胜负、轮数上限判胜或平局结束，无崩溃、非法行动或无法解释的状态分歧。
    required: true
  professional_review:
    required: true
    reviewer_role: pos:veilfront-xiangqi-siege:quality:qa-release-lead
    criteria:
    - 每项验收条件都有版本、执行命令、退出状态、随机种子和证据路径。
    - 生产者没有作为自己交付物的唯一审查者。
    - 规则规格、实现、AI 权限与黑盒观察结果互相一致。
    - 失败没有通过删除用例、降低阈值或重写已确认规则被掩盖。
    - 回合上限、AI 搜索预算、随机性与难度仍以证据建议呈现，未被自动冻结。
  human_gate:
    required: true
    gate_id: GATE-1
    question: 核心循环、玩家行为、胜负与反馈闭环是否值得进入正式功能开发，且剩余技术成本与风险是否可接受？
  success_conditions:
  - CTR-P1-001 的全部必要自动检查和独立专业审查通过。
  - 原型能从种子化开局完整运行至三旗、将帅实际死亡、轮数上限判胜或平局结算。
  - 局域网真人测试工具仅以手动 IP、一个房主和一个客户端完成可信局域网体验取样，不形成正式联网架构、发布承诺或 GATE-1 自动结论。
  - 批量对局与人工试玩形成单局轮数上限建议，但冻结该值仍由项目所有者决定。
  - GATE-1 批准记录与已批准 Project Brief v4、当前 Contract v5、原型提交、构建和证据摘要完全匹配。
state_machine:
  state_machine_id: LOOP-SM-DEFAULT
  version: '0.2'
  allowed_overrides: []
failure_and_exit:
  blocking_conditions:
  - Contract 或输入摘要与批准记录不匹配。
  - 规则语义存在冲突且无法在既有确认范围内澄清。
  - 缺少 Godot 4.7.1 可执行环境、独立 QA 或可靠的无头证据。
  - 技术限制要求改变核心体验、信息边界、首版单机核心范围、局域网测试工具的可丢弃定位或目标平台。
  - 任一必要自动检查失败且本轮预算不足以修订。
  rollback:
    return_to: TASK-SPEC-001；若问题改变范围则返回 P0
    preserve:
    - 失败种子、回放日志、状态摘要与最小复现。
    - 所有版本化规格、测试矩阵、审计日志和评审反馈。
    - 可验证但未被批准为正式架构的技术探索结果。
    - 局域网真人测试失败日志、双实例复现步骤、网络协议版本与信息泄露检查结果。
  cancellation_conditions:
  - 项目所有者取消垂直切片或改变项目范围。
  - 证据证明核心闭环在批准边界内不可行，且项目所有者选择停止而非修订。
  final_handoff:
    receiver_role: pos:veilfront-xiangqi-siege:root:project-manager
    required_contents:
    - 通过的规则、迷雾、确定性、AI 公平与批量对局证据索引。
    - GATE-1 人工批准记录及其 subject_digest。
    - 可保留的规格与测试、必须丢弃或重写的原型代码清单。
    - 局域网真人测试工具的体验记录、已知限制、信息边界证据及正式开发前必须重写的部分。
    - 正式功能开发与资产生产的准入条件、风险和未解决问题。
coordination:
  allowed_parent_loop_types:
  - project-production
  dependency_rules:
  - 本循环启动依赖项目简报、组织、权限、Preset 与 Skill Binding 均已批准且摘要匹配。
  - 正式功能开发循环和资产生产循环必须阻塞等待本循环完成且 GATE-1 获批。
  child_loop_creation:
    allowed: false
    conditions: []
    required_authority_scope: []
  registry_binding:
    store_runtime_relationships_in_registry: true
lan_playtest_tool_exception:
  exception_id: LAN-PLAYTEST-TOOL-001
  classification: owner-approved disposable playtest tooling
  status: approved
  approved_by: project-owner
  approved_at: '2026-08-17T21:53:52.382912+08:00'
  source_ref: codex-thread://current#owner-rule-revision-5
  scope: 仅用于 GATE-1 前在可信局域网内采集两名真人玩家的节奏、迷雾推理、公平感和随机挫败反馈；不改变单机核心范围，也不承诺正式联网架构。
  architecture:
    transport: Godot ENetMultiplayerPeer
    authority: 房主独占 FullState、规则 RNG、准备 token 与完整审计；客户端只提交规范化 intent 并接收自身 PlayerView。
    delivery: 仅可靠离散消息；不复制棋子节点、不逐帧同步、不使用专用服务器。
  allowed:
  - 手动输入局域网 IPv4 地址创建或加入一对一房间。
  - 房主权威校验席位、行动方、action_index、规范化 intent 与重复请求。
  - 分别向红黑两侧发送各自 PlayerView、公开行动反馈、连接状态和终局结果。
  - 在独立 Git worktree 中与单机 AI 并行开发，并在 AI 稳定提交后进行串行 UI 集成。
  forbidden:
  - 把 FullState、RNG 内部状态、未来随机结果、完整审计日志或对手不可见信息发送给客户端。
  - 自动发现、互联网穿透、公开匹配、观战、聊天、断线重连、房主迁移、专用服务器和面向发布的反作弊承诺。
  - 把该工具认定为正式联网功能、正式架构、发布范围或 GATE-1 通过证据。
  artifact_mapping:
  - scripts/prototype/network/
  - scenes/prototype/network/
  - tests/prototype/network/
  - docs/prototype/lan-playtest-tool-map-v1.md
  integration_constraint: 并行阶段不得修改 scripts/prototype/ai/、AI 配置资源、现有 gate1_logic_lab.tscn、match_controller.gd 或 player_view_projector.gd；共享接线必须等待
    AI 稳定提交。
  invalidation_conditions:
  - 再次发生未经项目所有者批准的信息边界、规则语义、单机核心范围或目标平台变化。
  - 需要扩大到互联网、公开玩家、专用服务器或正式发布架构。
  - 双实例测试发现客户端可区分隐藏等价 FullState，或需要向客户端暴露受禁字段。
  - 项目所有者撤销本例外。
  rule_revision_binding:
    status: reapproved_after_rule_and_information-boundary-change
    rule_revision_id: OWNER-RULE-REVISION-5-2026-08-17
    requirements:
    - 客户端与房主 UI 只接收各自已发现旗位；不得接收未发现旗位或另一方发现记忆。
    - 客户端仅接收自身 PlayerView 中的旗帜发现记忆、夺旗进度与成功反馈。
    - 双方客户端接收不含未授权死亡坐标的公开阵亡记录；被吃虚影只下发给阵亡方。
    - 房主权威处理隐身马接触、敌车/敌兵田字阻挡和士献祭复活随机结果。
    - 本地右键标注不经网络同步。
    - 规则改动后的双实例、镜像坐标、隐藏等价和下行白名单必须重新验证。
owner_rule_revision_5:
  revision_id: OWNER-RULE-REVISION-5-2026-08-17
  status: approved
  decision_owner: project-owner
  source_ref: codex-thread://current#owner-rule-revision-5
  precedence: 本节覆盖 owner_rule_revision 中冲突的 v4 语义。
  rules:
    intersection_board:
      authoritative_points: X=1..9,Y=1..24
      piece_placement: intersections_only
      red_view: red base rendered at bottom
      black_view: 180-degree display mirror with black base at bottom
      coordinate_semantics: mirror never changes authoritative coordinates or intent normalization
    wall_geometry:
      red_wall_line: Y=4
      black_wall_line: Y=21
      pawn_alignment: red pawns Y=4; black pawns Y=21
      intact_wall_entry: enemy pieces may neither enter nor cross the defending wall line
      deepest_enemy_points_while_intact: red attackers to Y=20 before black wall; black attackers to Y=5 before red wall
    elephant_field:
      vision_union: origin-centered 3x3 + move field 3x3 + target-centered 3x3
      blocking_targets: enemy rooks and enemy pawns only
      entry_rule: a target entering or crossing from outside stops at its first path/field intersection
      friendly_targets_blocked: false
      inside_exit_retriggered: false
      applies_in: buffer plus battlefield only
    hidden_horse_rook_contact:
      ordinary_rook_resolution: capture the first unrevealed enemy horse encountered and stop at that intersection
      forbidden_outcome: invisible blocker causing silent rejection or no-feedback movement failure
    flags:
      spawn: three unique points uniformly sampled from X=1..9,Y=9..16
      visibility: normal fog visibility per observer
      discovery_memory: once seen, position remains permanently visible to that observer only
