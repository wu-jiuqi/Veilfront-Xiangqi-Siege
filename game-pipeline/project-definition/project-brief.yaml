  statements:
  - statement_id: stmt:veilfront-xiangqi-siege:project-goal
    domain: project-goal
    text: 将中国象棋改造成一款回合制战役型棋类游戏，以战争迷雾、侦察、破城、兵种阶段能力与三旗争夺构成区别于传统象棋的核心体验。
    status: confirmed
    decision_owner: project-owner
    source_refs:
    - source:veilfront-xiangqi-siege:owner-planning-conversation
  - statement_id: stmt:veilfront-xiangqi-siege:project-name
    domain: project-goal
    text: '正式项目名为《雾疆：九路烽棋》，英文名为 Veilfront: Xiangqi Siege，日常简称可使用‘雾疆 / Veilfront’。'
    status: confirmed
    decision_owner: project-owner
    source_refs:
    - source:veilfront-xiangqi-siege:project-identity
    - source:veilfront-xiangqi-siege:owner-planning-conversation
  - statement_id: stmt:veilfront-xiangqi-siege:board-and-fog
    domain: gameplay
    text: 棋盘采用中国象棋式24×9交点坐标，棋子落在点线上而不是格子中心；红方大本营Y=1～3、缓冲区Y=4～8，中央战区Y=9～16，黑方缓冲区Y=17～21、大本营Y=22～24。红墙为Y=4点线、黑墙为Y=21点线，兵卒初始点就在各自城墙线上。项目取消楚河汉界与河界概念，除将帅和士受九宫限制外，其他棋子可在全棋盘行动。开局除己方大本营外均受战争迷雾影响，普通棋子以当前位置为中心提供3×3动态视野，移动后旧区域重新进入迷雾。
    status: confirmed
    decision_owner: project-owner
    source_refs:
    - source:veilfront-xiangqi-siege:owner-planning-conversation
    - source:veilfront-xiangqi-siege:owner-rules-revision
    - source:veilfront-xiangqi-siege:owner-rule-revision-5
  - statement_id: stmt:veilfront-xiangqi-siege:phase-gameplay
    domain: gameplay
    text: 双方城墙状态独立结算。除炮的区域轰炸外，所有特殊规则仅在两个缓冲区与中央战区内生效，且一次特殊行动的起点、经过格和终点必须全部位于该区域；任意大本营内的棋子使用默认象棋规则。炮是唯一例外，位于己方大本营且敌方城墙完整时仍可对缓冲区和战区实施3×3范围随机三格轰炸。
    status: confirmed
    decision_owner: project-owner
    source_refs:
    - source:veilfront-xiangqi-siege:owner-planning-conversation
    - source:veilfront-xiangqi-siege:owner-rules-revision
  - statement_id: stmt:veilfront-xiangqi-siege:horse-elephant-rules
    domain: gameplay
    text: 马与相象可在全棋盘行动，但无视蹩马腿、无视堵象眼、隐身和相视野只在敌方城墙完整且行动完全发生于Y=4～21时生效；在任意大本营内，马受到蹩马腿限制，相象受到堵象眼限制。相象合资格移动后的视野为起点中心3×3、起终点组成的田字格九点与终点中心3×3的并集；田字格九点仅阻挡敌方车与敌方兵卒从格外进入或穿过，使其停在路径首个交点，己方车与兵卒不受影响，已在格内的受阻棋子下一次可正常离开。敌方城墙倒塌后，两者恢复默认限制并移除特殊能力。
    status: confirmed
    decision_owner: project-owner
    source_refs:
    - source:veilfront-xiangqi-siege:owner-planning-conversation
    - source:veilfront-xiangqi-siege:owner-rules-revision
    - source:veilfront-xiangqi-siege:owner-rules-finalization
    - source:veilfront-xiangqi-siege:owner-rule-revision-5
  - statement_id: stmt:veilfront-xiangqi-siege:cannon-rules
    domain: gameplay
    text: 炮的区域轰炸属于不需要炮架、不会移动炮的特殊行动；每门炮初始拥有两发区域轰炸弹药，没有冷却，允许友军伤害，弹药消耗后不恢复。轰炸中心的完整3×3九格范围必须全部位于两个缓冲区和战区（Y=4～21），再从九格内随机抽取三个不同伤害格。炮的常规移动与精确吃子继续遵守传统象棋规则，精确吃子必须隔一枚炮架并移动至目标格。区域轰炸与常规行动互斥。
    status: confirmed
    decision_owner: project-owner
    source_refs:
    - source:veilfront-xiangqi-siege:owner-planning-conversation
    - source:veilfront-xiangqi-siege:owner-rules-revision
    - source:veilfront-xiangqi-siege:owner-rules-finalization
  - statement_id: stmt:veilfront-xiangqi-siege:rook-rules
    domain: gameplay
    text: 当敌方城墙完整且整段行动位于两个缓冲区或战区时，车可以穿过并按从起点到终点的路径顺序依次消灭全部敌方棋子，但不能穿过己方棋子；不再触发任何被动士替死，若将帅实际死亡则立即以最高优先级结束游戏，不再处理路径上的后续目标。本次移动路径形成特殊视野，持续到该车下一次移动开始。车从有效敌方相田字格外进入或穿过时停在首个交点；己方相不阻挡己方车，从田字格内离开不再次触发。普通车的路径首次接触未显形敌马时，在接触点吃掉该马并停止，不能让隐身马造成无反馈的阻挡或行动失败。
    status: confirmed
    decision_owner: project-owner
    source_refs:
    - source:veilfront-xiangqi-siege:owner-rules-revision
    - source:veilfront-xiangqi-siege:owner-rules-finalization
    - source:veilfront-xiangqi-siege:owner-rule-revision-5
  - statement_id: stmt:veilfront-xiangqi-siege:pawn-rules
    domain: gameplay
    text: 项目取消兵卒的过河判定，兵卒默认始终按已过河状态，可向前、左或右移动一格并吃掉终点敌棋。在敌方城墙完整且整段行动位于两个缓冲区或战区时，兵卒可改为横竖行军2至5格并穿过一枚或多枚敌方棋子，但不能穿过己方棋子、不能停在被占用格，穿越不会造成伤害或吃子；该长距离行动不打开路径视野，只按移动前起点与抵达后终点的普通动态视野投影。敌兵卒从有效相田字格外进入或穿过时与敌车相同，只移动到路径首个交点；己方相不阻挡己方兵卒。
    status: confirmed
    decision_owner: project-owner
    source_refs:
    - source:veilfront-xiangqi-siege:owner-rules-revision
    - source:veilfront-xiangqi-siege:owner-pawn-ai-clarification
    - source:veilfront-xiangqi-siege:owner-rule-revision-5
  - statement_id: stmt:veilfront-xiangqi-siege:wall-cycle
    domain: gameplay
    text: 完整城墙阻挡敌方棋子踏入或跨越守方城墙点线；红方敌棋最多到Y=5、黑方敌棋最多到Y=20，墙倒塌或修复中才可进入红Y=4或黑Y=21及其后的守方区域。至少3枚敌方棋子同时进入缓冲区时城墙倒塌。缓冲区与大本营内敌军少于3枚并持续一个完整回合后城墙恢复；恢复时只将大本营内入侵棋子随机撤回各自大本营空点，清除位置关联临时状态但不恢复已消耗的永久资源，也不附加行动惩罚。
    status: confirmed
    decision_owner: project-owner
    source_refs:
    - source:veilfront-xiangqi-siege:owner-planning-conversation
    - source:veilfront-xiangqi-siege:owner-rule-revision-5
  - statement_id: stmt:veilfront-xiangqi-siege:victory-and-flags
    domain: gameplay
    text: 三面单点旗帜在完整战区X=1～9、Y=9～16内随机生成于三个不同点，并受正常迷雾视野影响。旗帜首次进入某方视野时向该方显示并写入永久发现记忆，此后即使重新入雾也在该方地图保留旗帜图标；未发现方的PlayerView、AI输入和LAN下行不含坐标，规则种子也不得下发到可反推未发现旗位的客户端。棋子踏入可占旗点后公开“红方/黑方正在夺旗(n/3)”，完成时公开“红方/黑方成功夺得一面旗帜”；这些进度消息本身不向尚未发现该旗的一方公开位置。同时占领三旗立即获胜。
    status: confirmed
    decision_owner: project-owner
    source_refs:
    - source:veilfront-xiangqi-siege:owner-planning-conversation
    - source:veilfront-xiangqi-siege:owner-rules-revision
    - source:veilfront-xiangqi-siege:owner-rules-finalization
    - source:veilfront-xiangqi-siege:owner-rule-revision-5
  - statement_id: stmt:veilfront-xiangqi-siege:piece-rescue
    domain: gameplay
    text: 取消最先两次阵亡强制士替死。活着且在场的士可以主动选择并确认献祭复活，也可在提交前取消；提交后消耗一次行动并以自己阵亡为代价，从己方公开阵亡记录中随机选择一枚非士、非帅/将棋子，随机复活到己方大本营空点。所有阵亡士和帅/将都会进入公开阵亡记录，但明确不属于复活随机候选池；无合资格目标或牺牲后仍无空点时动作非法。复活不会恢复已经消耗的弹药、技能次数或永久资源。
    status: confirmed
    decision_owner: project-owner
    source_refs:
    - source:veilfront-xiangqi-siege:owner-planning-conversation
    - source:veilfront-xiangqi-siege:owner-rules-finalization
    - source:veilfront-xiangqi-siege:owner-rule-revision-5
  - statement_id: stmt:veilfront-xiangqi-siege:casualty-and-memory
    domain: gameplay
    text: 任何原因造成的阵亡，包括吃子、车路径接触、炮击、主动献祭和将帅实际死亡，都先登记到所属方阵亡记录；双方PlayerView同步公开双方完整阵亡记录，复活棋子立即移出。只有被吃的棋子会在原交点为阵亡方留下不影响规则和高亮的半透明虚影，持续到对方下一次行动完成后消失；炮击与主动献祭不生成虚影。公开阵亡记录不等于士复活随机池，阵亡士与帅/将仍被排除。
    status: confirmed
    decision_owner: project-owner
    source_refs:
    - source:veilfront-xiangqi-siege:owner-rule-revision-5
  - statement_id: stmt:veilfront-xiangqi-siege:general-capture-rules
    domain: gameplay
    text: 项目完全取消将军、应将、将死、将帅照面限制与飞将规则；将帅可以进入敌方攻击范围，只有将帅被实际吃掉时才触发所属方失败，且该结果在同一结算窗口内具有最高优先级。
    status: confirmed
    decision_owner: project-owner
    source_refs:
    - source:veilfront-xiangqi-siege:owner-rules-finalization
  - statement_id: stmt:veilfront-xiangqi-siege:presentation
    domain: art-direction
    text: 24×9交点棋盘采用局部主战场视图与受战争迷雾约束的鸟瞰战术小地图；主视图完整呈现九路宽度并沿24线长轴移动，棋盘格保持正方形。红黑双方界面都令己方大本营位于底部，黑方仅做180°显示镜像，不改变权威坐标与行动语义。区域只用明亮底色色块和不越界的大字“大本营/缓冲区/战区”区分，不使用额外区域分割线；城墙点线单独加粗。迷雾用黑色半透明蒙版覆盖底色，可见内容穿透蒙版。车移动路径与相田字侦察/阻挡范围分别沿棋盘线绘制专属高亮边框。未选棋时右键可在交点放置圆、叉或方形的玩家私有标记；已选棋时首次右键只取消选择，再次右键才进入标记，标记不影响正常高亮。普通行动、炮击和士献祭最终确认均在主棋盘完成，所有待确认行动支持取消。
    status: confirmed
    decision_owner: project-owner
    source_refs:
    - source:veilfront-xiangqi-siege:owner-planning-conversation
    - source:veilfront-xiangqi-siege:owner-rule-revision-5
  - statement_id: stmt:veilfront-xiangqi-siege:visual-direction
    domain: art-direction
    text: 世界观确认为中国古代架空背景，同时存在朝代体系与修仙体系；美术路线冻结为90° top-down 2D俯视、角色化单位、东方战争奇幻、回合制迷雾战术象棋。GATE-1纯逻辑原型已经通过，首版Demo交付范围改为包含完整的Demo级棋盘、棋子、界面、迷雾、旗帜、特效、动画与音频资源；具体资产精度、色彩语言、角色比例和制作清单须先通过GATE-2美术基线审查，再启动高成本批量生产。
    status: confirmed
    decision_owner: project-owner
    source_refs:
    - source:veilfront-xiangqi-siege:owner-scope-clarification
    - source:veilfront-xiangqi-siege:owner-rules-finalization
    - source:veilfront-xiangqi-siege:owner-demo-scope-revision
  - statement_id: stmt:veilfront-xiangqi-siege:demo-delivery-scope
    domain: scope-constraints
    text: 首版Demo包含完整规则的人对人联机对战、达到Demo展示标准的完整美术资源和新手教学关卡；暂不包含AI人机对战。互联网联机仍是Demo最终目标，但当前紧接GATE-1的生产循环只负责正式架构边界、教学灰盒和视觉基线，不实现互联网传输、匹配、服务器部署或Steam网络接入。
    status: confirmed
    decision_owner: project-owner
    source_refs:
    - source:veilfront-xiangqi-siege:owner-demo-scope-revision
  - statement_id: stmt:veilfront-xiangqi-siege:tutorial
    domain: gameplay
    text: 首版Demo必须包含新手教学关卡；教学采用可重复、可重置的固定局面与脚本化目标，引导玩家理解交点棋盘、迷雾、城墙、兵种特殊行动、夺旗和士献祭。教学对手或局面推进器只执行教学脚本，不构成AI人机对战，也不得另建一套规则实现。
    status: confirmed
    decision_owner: project-owner
    source_refs:
    - source:veilfront-xiangqi-siege:owner-demo-scope-revision
  - statement_id: stmt:veilfront-xiangqi-siege:implementation
    domain: implementation
    text: GATE-1已经验证确定性规则核心、可复现随机种子、按观察者过滤的PlayerView与可回放行动日志可行。正式架构应把规则域、对局用例、PlayerView投影、表现层、教学脚本和未来网络传输分离；任何未来互联网对战端点都只能提交规范化意图并接收自身PlayerView，权威端独占FullState与随机消费。该正式边界仍须在下一循环经技术审查和GATE-2验证，互联网传输实现不在该循环范围内。
    status: confirmed
    decision_owner: project-owner
    source_refs:
    - source:veilfront-xiangqi-siege:owner-planning-conversation
    - source:veilfront-xiangqi-siege:owner-demo-scope-revision
  - statement_id: stmt:veilfront-xiangqi-siege:single-player-ai
    domain: implementation
    text: AI人机对战明确不进入首版Demo。现有规则型/搜索型AI及其公平性测试作为研究资产和回归参考保留，但不承担Demo体验、难度或发布验收；未来若重新纳入，仍必须只读取玩家等价PlayerView并重新立项评估训练、搜索质量和内容成本。
    status: confirmed
    decision_owner: project-owner
    source_refs:
    - source:veilfront-xiangqi-siege:owner-scope-clarification
    - source:veilfront-xiangqi-siege:owner-demo-scope-revision
  - statement_id: stmt:veilfront-xiangqi-siege:godot-authoring
    domain: implementation
    text: Godot实现优先使用编辑器预置场景、节点和资源，只有棋子实例、迷雾单元、行动轨迹等运行时数量由对局数据决定，或动态方案明显更安全简单时才动态创建节点。GATE-1原型目录只作为行为与测试基线，不能未经架构审查直接升级为正式工程结构。
    status: confirmed
    decision_owner: project-owner
    source_refs:
    - source:veilfront-xiangqi-siege:project-identity
    - source:veilfront-xiangqi-siege:owner-demo-scope-revision
  - statement_id: stmt:veilfront-xiangqi-siege:platform-engine
    domain: platform-engine
    text: 游戏引擎确认为Godot 4.7.1，首发平台为Steam，首版Demo以桌面端互联网人对人对战为最终交付目标，并包含本地运行的新手教学关卡；具体支持的操作系统、输入设备、Steam网络能力和服务器形态留待后续联网技术基线确认。
    status: confirmed
    decision_owner: project-owner
    source_refs:
    - source:veilfront-xiangqi-siege:project-identity
    - source:veilfront-xiangqi-siege:owner-planning-conversation
    - source:veilfront-xiangqi-siege:owner-scope-clarification
    - source:veilfront-xiangqi-siege:owner-demo-scope-revision
  - statement_id: stmt:veilfront-xiangqi-siege:scope-constraints
    domain: scope-constraints
    text: 首版Demo不包含AI人机对战；互联网人对人对战、完整Demo级美术和新手教学属于交付范围。排位、观战、聊天、赛季、商业化、房主迁移和是否部署专用服务器尚未纳入已确认范围。当前不设置团队规模、预算或周期约束；任何服务器采购、第三方服务、资产量和交付日期都必须另行确认。
    status: confirmed
    decision_owner: project-owner
    source_refs:
    - source:veilfront-xiangqi-siege:owner-scope-clarification
    - source:veilfront-xiangqi-siege:owner-demo-scope-revision
  open_questions:
  - question_id: question:veilfront-xiangqi-siege:flag-and-victory
    question: 单局完整轮上限仍需通过纯逻辑原型的批量对局与人工试玩确定；达到上限后的旗帜判胜和平局规则已经冻结。
    decision_owner: project-owner
    blocks_staffing: false
  - question_id: question:veilfront-xiangqi-siege:ai-information
    question: AI人机对战已从首版Demo移除；现有AI只作为研究与回归资产保留，何时重启AI质量提升与是否需要训练由未来独立范围决定。
    decision_owner: project-owner
    blocks_staffing: false
  - question_id: question:veilfront-xiangqi-siege:internet-architecture
    question: 互联网Demo采用Steam Networking/SDR、传统权威专用服务器、玩家房主中继或混合方案尚未决定；服务器地区、并发、断线重连、匹配、账号和发布级反作弊目标也未冻结。本问题不阻断紧接GATE-1的正式架构与教学灰盒循环，但在启动互联网实现和采购前必须解决。
    decision_owner: project-owner
    blocks_staffing: false
  - question_id: question:veilfront-xiangqi-siege:art-baseline
    question: Demo要求完整美术资源，但资产清单、角色比例、目标分辨率、帧数、特效与音频数量、外包策略和验收样片尚未冻结；必须在批量资产生产前通过GATE-2视觉基线审查。
    decision_owner: project-owner
    blocks_staffing: false
  - question_id: question:veilfront-xiangqi-siege:tutorial-coverage
    question: 教学关卡必须覆盖哪些规则、拆成几个步骤、失败和跳过策略以及是否记录完成状态，需在下一循环由系统体验职责形成教学脚本并以灰盒验证。
    decision_owner: project-owner
    blocks_staffing: false
  open_questions_note: 上述问题均不阻断本次正式架构审查、教学灰盒和视觉基线循环；互联网实现、批量高成本美术或未来AI立项前必须分别冻结对应问题。
  risks:
  - risk_id: risk:veilfront-xiangqi-siege:scope-uncertainty
    description: 首版Demo同时要求互联网人对人对战、完整Demo级美术和新手教学，但团队、预算与周期暂不设约束，当前不能形成有日期和资源承诺的生产预测。
    evidence_refs:
    - stmt:veilfront-xiangqi-siege:platform-engine
    - stmt:veilfront-xiangqi-siege:scope-constraints
    impact: high
    staffing_implication: 可以按能力覆盖设计职责，但不能把组织建议解读为已批准人数、成本或交付日期。
  - risk_id: risk:veilfront-xiangqi-siege:rules-complexity
    description: 迷雾、独立城墙阶段、棋子特殊能力、随机炮击、强制撤回和多重胜利条件叠加，容易出现结算顺序歧义与状态组合缺陷。
    evidence_refs:
    - stmt:veilfront-xiangqi-siege:phase-gameplay
    - stmt:veilfront-xiangqi-siege:wall-cycle
    - stmt:veilfront-xiangqi-siege:victory-and-flags
    impact: high
    staffing_implication: 需要独立的规则规格、确定性测试矩阵与可复现对局证据，不能只依靠手工试玩验收。
  - risk_id: risk:veilfront-xiangqi-siege:hidden-information
    description: 合法落点提示、镜头、音效、小地图、炮架判定、教学脚本或未来网络同步都可能无意泄露迷雾内信息。
    evidence_refs:
    - stmt:veilfront-xiangqi-siege:board-and-fog
    - stmt:veilfront-xiangqi-siege:presentation
    - stmt:veilfront-xiangqi-siege:implementation
    impact: high
    staffing_implication: 需要从规则、客户端表现、网络协议与QA四个角度独立验收信息边界。
  - risk_id: risk:veilfront-xiangqi-siege:balance
    description: 兵卒穿敌长距离机动、马的隐身与区域内无蹩腿、车的路径多目标歼灭及远程随机炮击可能压缩其他棋子的战略价值，或放大先手和随机优势。
    evidence_refs:
    - stmt:veilfront-xiangqi-siege:phase-gameplay
    - stmt:veilfront-xiangqi-siege:horse-elephant-rules
    - stmt:veilfront-xiangqi-siege:cannon-rules
    - stmt:veilfront-xiangqi-siege:rook-rules
    - stmt:veilfront-xiangqi-siege:pawn-rules
    impact: medium
    staffing_implication: 需要可观测的平衡指标、对局日志、批量模拟或结构化试玩，不应在纸面阶段宣布平衡完成。
  - risk_id: risk:veilfront-xiangqi-siege:art-unknown
    description: 首版Demo已要求完整美术资源，但资产精度、色彩语言、角色比例、动画、音频、修仙元素强度和制作总量仍未形成可估算的美术基线。
    evidence_refs:
    - stmt:veilfront-xiangqi-siege:visual-direction
    impact: high
    staffing_implication: 下一循环只能建立视觉基线、资产清单和可审查样片；具体产能、外包与批量制作承诺必须等待GATE-2。
  - risk_id: risk:veilfront-xiangqi-siege:ai-fairness
    description: 现有AI虽然通过公平性技术验证，但对战质量不足以支持首版Demo；若未来恢复，仍需重新评估不完全信息决策、训练或搜索成本和可解释难度。
    evidence_refs:
    - stmt:veilfront-xiangqi-siege:board-and-fog
    - stmt:veilfront-xiangqi-siege:single-player-ai
    impact: low
    staffing_implication: 首版Demo不为AI配置交付职责；保留PlayerView公平契约与测试资产，未来重新立项时再评估人员和质量门槛。
  - risk_id: risk:veilfront-xiangqi-siege:internet-production
    description: 局域网真人测试只证明基础双机体验，不能证明NAT穿透、互联网延迟、断线恢复、服务可用性、运营成本和发布级安全；直接扩展原型LAN代码会积累高风险技术债。
    evidence_refs:
    - stmt:veilfront-xiangqi-siege:demo-delivery-scope
    - stmt:veilfront-xiangqi-siege:implementation
    - stmt:veilfront-xiangqi-siege:platform-engine
    impact: high
    staffing_implication: 正式架构先冻结权威边界和传输端口；互联网实现必须另立获批Contract并提供服务端、网络QA和部署运维责任。
  - risk_id: risk:veilfront-xiangqi-siege:tutorial-divergence
    description: 若教学通过专用作弊分支、复制规则或直接操作棋盘状态推进，将与正式对战规则产生分歧并可能泄露隐藏信息。
    evidence_refs:
    - stmt:veilfront-xiangqi-siege:tutorial
    - stmt:veilfront-xiangqi-siege:implementation
    impact: medium
    staffing_implication: 教学脚本必须通过同一规范化意图和事件接口驱动，并以可重置固定局面和自动验收证明没有第二套规则。
