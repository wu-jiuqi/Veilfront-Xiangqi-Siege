  statements:
  - statement_id: stmt:veilfront-xiangqi-siege:project-goal
    domain: project-goal
    text: 将中国象棋改造成一款回合制战役型棋类游戏，以战争迷雾、侦察、破城、兵种阶段能力与三旗争夺构成区别于传统象棋的核心体验。
    status: confirmed
    decision_owner: project-owner
    source_refs:
    - source:veilfront-xiangqi-siege:owner-planning-conversation
  - statement_id: stmt:veilfront-xiangqi-siege:project-name
    domain: project-goal
    text: "正式项目名为《雾疆：九路烽棋》，英文名为 Veilfront: Xiangqi Siege，日常简称可使用‘雾疆 / Veilfront’。"
    status: confirmed
    decision_owner: project-owner
    source_refs:
    - source:veilfront-xiangqi-siege:project-identity
    - source:veilfront-xiangqi-siege:owner-planning-conversation
  - statement_id: stmt:veilfront-xiangqi-siege:board-and-fog
    domain: gameplay
    text: 棋盘为24×9格，按双方各5线大本营、各3线缓冲区与中央8线战区划分；项目取消楚河汉界与河界概念，除将帅和士受九宫限制外，其他棋子可在全棋盘行动。开局除己方大本营外均受战争迷雾影响，普通棋子以当前位置为中心提供3×3动态视野，移动后旧区域重新进入迷雾。
    status: confirmed
    decision_owner: project-owner
    source_refs:
    - source:veilfront-xiangqi-siege:owner-planning-conversation
    - source:veilfront-xiangqi-siege:owner-rules-revision
  - statement_id: stmt:veilfront-xiangqi-siege:phase-gameplay
    domain: gameplay
    text: 双方城墙状态独立结算。除炮的区域轰炸外，所有特殊规则仅在两个缓冲区与中央战区内生效，且一次特殊行动的起点、经过格和终点必须全部位于该区域；任意大本营内的棋子使用默认象棋规则。炮是唯一例外，位于己方大本营且敌方城墙完整时仍可对缓冲区和战区实施3×3范围随机三格轰炸。
    status: confirmed
    decision_owner: project-owner
    source_refs:
    - source:veilfront-xiangqi-siege:owner-planning-conversation
    - source:veilfront-xiangqi-siege:owner-rules-revision
  - statement_id: stmt:veilfront-xiangqi-siege:horse-elephant-rules
    domain: gameplay
    text: 马与相象可在全棋盘行动，但无视蹩马腿、无视堵象眼、隐身和田字侦察只在敌方城墙完整且行动完全发生于两个缓冲区或战区时生效；在任意大本营内，马受到蹩马腿限制，相象受到堵象眼限制。相象每次完成合资格移动后刷新该棋子的田字显形区域，区域内的隐身马显形；当相象移动导致旧区域失效，或马移动后不再处于任一有效田字显形区域时，若无其他显形原因则马恢复隐身。敌方城墙倒塌后，两者在全棋盘恢复对应默认限制并移除特殊能力。
    status: confirmed
    decision_owner: project-owner
    source_refs:
    - source:veilfront-xiangqi-siege:owner-planning-conversation
    - source:veilfront-xiangqi-siege:owner-rules-revision
    - source:veilfront-xiangqi-siege:owner-rules-finalization
  - statement_id: stmt:veilfront-xiangqi-siege:cannon-rules
    domain: gameplay
    text: 炮的区域轰炸属于不需要炮架、不会移动炮的特殊行动；每门炮初始拥有两发区域轰炸弹药，没有冷却，允许友军伤害，弹药消耗后不恢复。轰炸中心的完整3×3九格范围必须全部位于两个缓冲区和战区（Y=6～19），再从九格内随机抽取三个不同伤害格。炮的常规移动与精确吃子继续遵守传统象棋规则，精确吃子必须隔一枚炮架并移动至目标格。区域轰炸与常规行动互斥。
    status: confirmed
    decision_owner: project-owner
    source_refs:
    - source:veilfront-xiangqi-siege:owner-planning-conversation
    - source:veilfront-xiangqi-siege:owner-rules-revision
    - source:veilfront-xiangqi-siege:owner-rules-finalization
  - statement_id: stmt:veilfront-xiangqi-siege:rook-rules
    domain: gameplay
    text: 当敌方城墙完整且整段行动位于两个缓冲区或战区时，车可以穿过并按从起点到终点的路径顺序依次消灭全部敌方棋子，但不能穿过己方棋子；每个目标先结算阵亡与士替死，若将帅实际死亡则立即以最高优先级结束游戏，不再处理路径上的后续目标。本次移动路径形成特殊视野，持续到该车下一次移动开始。车在大本营内、敌方城墙倒塌后或不满足完整区域条件时使用默认象棋规则。
    status: confirmed
    decision_owner: project-owner
    source_refs:
    - source:veilfront-xiangqi-siege:owner-rules-revision
    - source:veilfront-xiangqi-siege:owner-rules-finalization
  - statement_id: stmt:veilfront-xiangqi-siege:pawn-rules
    domain: gameplay
    text: 项目取消兵卒的过河判定，兵卒默认始终按已过河状态，可向前、左或右移动一格。在敌方城墙完整且整段行动位于两个缓冲区或战区时，兵卒可横竖行军1至5格并穿过一枚或多枚敌方棋子，但不能穿过己方棋子、不能停在被占用格，穿越不会造成伤害或吃子。
    status: confirmed
    decision_owner: project-owner
    source_refs:
    - source:veilfront-xiangqi-siege:owner-rules-revision
  - statement_id: stmt:veilfront-xiangqi-siege:wall-cycle
    domain: gameplay
    text: 完整城墙阻挡敌方棋子从缓冲区进入大本营；至少3枚敌方棋子同时进入缓冲区时城墙倒塌。缓冲区与大本营内敌军少于3枚并持续一个完整回合后城墙恢复；恢复时只将大本营内入侵棋子随机撤回各自大本营空格，清除位置关联临时状态但不恢复已消耗的永久资源，也不附加行动惩罚。
    status: confirmed
    decision_owner: project-owner
    source_refs:
    - source:veilfront-xiangqi-siege:owner-planning-conversation
  - statement_id: stmt:veilfront-xiangqi-siege:victory-and-flags
    domain: gameplay
    text: 三个单格旗帜只在战区中央3×9区域内随机生成：每局先等概率选择Y=11～13或Y=12～14作为三行带，再于X=1～9范围抽取三个不同合法格；不要求中心对称或镜像模板，并在开局时向双方公开。棋子需承受对方三次行动后完成占领；同时占领三旗立即获胜。单局完整轮上限待逻辑原型测试后确定；达到上限时以旗帜数量判胜，同数为平局。将帅实际死亡具有最高胜利优先级。
    status: confirmed
    decision_owner: project-owner
    source_refs:
    - source:veilfront-xiangqi-siege:owner-planning-conversation
    - source:veilfront-xiangqi-siege:owner-rules-revision
    - source:veilfront-xiangqi-siege:owner-rules-finalization
  - statement_id: stmt:veilfront-xiangqi-siege:piece-rescue
    domain: gameplay
    text: 每方本局最先发生的两次合资格阵亡事件触发士替死，合资格目标为除将帅和士之外的己方棋子；触发时从仍存活且未消耗替死能力的左士或右士中随机选择一枚移除，并将被救棋子随机部署到己方大本营空格。若无可用士则正常阵亡；复活不会恢复已经消耗的弹药、技能次数或永久资源。
    status: confirmed
    decision_owner: project-owner
    source_refs:
    - source:veilfront-xiangqi-siege:owner-planning-conversation
    - source:veilfront-xiangqi-siege:owner-rules-finalization
  - statement_id: stmt:veilfront-xiangqi-siege:general-capture-rules
    domain: gameplay
    text: 项目完全取消将军、应将、将死、将帅照面限制与飞将规则；将帅可以进入敌方攻击范围，只有将帅被实际吃掉时才触发所属方失败，且该结果在同一结算窗口内具有最高优先级。
    status: confirmed
    decision_owner: project-owner
    source_refs:
    - source:veilfront-xiangqi-siege:owner-rules-finalization
  - statement_id: stmt:veilfront-xiangqi-siege:presentation
    domain: art-direction
    text: 24×9棋盘采用局部主战场视图与受战争迷雾约束的鸟瞰战术小地图；主视图应完整呈现九路宽度并沿24线长轴移动，普通行动与炮击最终确认均在主棋盘完成。
    status: confirmed
    decision_owner: project-owner
    source_refs:
    - source:veilfront-xiangqi-siege:owner-planning-conversation
  - statement_id: stmt:veilfront-xiangqi-siege:visual-direction
    domain: art-direction
    text: 世界观确认为中国古代架空背景，同时存在朝代体系与修仙体系；美术路线冻结为90° top-down 2D俯视、角色化单位、东方战争奇幻、回合制迷雾战术象棋。首个P0里程碑先完成不依赖正式美术即可完整运行的纯逻辑原型，再进入视觉制作；具体资产精度、色彩语言、角色比例、动画与音频仍由后续美术基线细化。
    status: confirmed
    decision_owner: project-owner
    source_refs:
    - source:veilfront-xiangqi-siege:owner-scope-clarification
    - source:veilfront-xiangqi-siege:owner-rules-finalization
  - statement_id: stmt:veilfront-xiangqi-siege:implementation
    domain: implementation
    text: 建议采用与显示层解耦的确定性规则核心、可复现随机种子、按玩家视角过滤的迷雾快照与可回放行动日志；若包含在线对战，则由权威服务器持有完整棋盘状态。该实现方向属于待技术原型验证的假设，并非已冻结架构。
    status: hypothesis
    decision_owner: project-owner
    source_refs:
    - source:veilfront-xiangqi-siege:owner-planning-conversation
  - statement_id: stmt:veilfront-xiangqi-siege:single-player-ai
    domain: implementation
    text: 首个版本只实现单机玩法，机器人对手采用人工设计和编写的规则型或搜索型AI，不使用机器学习，也不需要在线服务、排位或专用服务器。AI只能读取与玩家等价的可见状态，不得读取迷雾内敌棋、隐身马、隐藏炮架或其他未公开随机结果；具体搜索预算、随机性与难度档位留待原型测试。
    status: confirmed
    decision_owner: project-owner
    source_refs:
    - source:veilfront-xiangqi-siege:owner-scope-clarification
  - statement_id: stmt:veilfront-xiangqi-siege:godot-authoring
    domain: implementation
    text: Godot实现优先使用编辑器预置场景、节点和资源，只有运行时数据或生成方案明显更安全简单时才动态创建节点；当前仓库仅完成生产管线初始化，尚未创建project.godot或游戏资产。
    status: confirmed
    decision_owner: project-owner
    source_refs:
    - source:veilfront-xiangqi-siege:project-identity
  - statement_id: stmt:veilfront-xiangqi-siege:platform-engine
    domain: platform-engine
    text: 游戏引擎确认为Godot 4.7.1，首发平台为Steam，首个版本以桌面端单机对战为范围；具体支持的操作系统与输入设备组合留待技术基线细化。
    status: confirmed
    decision_owner: project-owner
    source_refs:
    - source:veilfront-xiangqi-siege:project-identity
    - source:veilfront-xiangqi-siege:owner-planning-conversation
    - source:veilfront-xiangqi-siege:owner-scope-clarification
  - statement_id: stmt:veilfront-xiangqi-siege:scope-constraints
    domain: scope-constraints
    text: 首个版本边界确认为单机版，不包含在线联机、排位和专用服务器；当前规划阶段不设置团队规模、预算或周期约束。该表述不代表资源无限，任何实际里程碑承诺仍需在进入生产规划时单独确认。
    status: confirmed
    decision_owner: project-owner
    source_refs:
    - source:veilfront-xiangqi-siege:owner-scope-clarification
  open_questions:
  - question_id: question:veilfront-xiangqi-siege:flag-and-victory
    question: 单局完整轮上限仍需通过纯逻辑原型的批量对局与人工试玩确定；达到上限后的旗帜判胜和平局规则已经冻结。
    decision_owner: project-owner
    blocks_staffing: false
  - question_id: question:veilfront-xiangqi-siege:ai-information
    question: 机器人AI与玩家等价的信息边界已经冻结；仍需通过原型确定AI搜索预算、决策随机性、难度档位与不得作弊的验收方式。
    decision_owner: project-owner
    blocks_staffing: false
  open_questions_note: 非阻断玩法问题可在编制获批后由相应责任范围形成规则规格，但在进入实现前必须冻结。
  risks:
  - risk_id: risk:veilfront-xiangqi-siege:scope-uncertainty
    description: 首版单机范围已经确定，但团队、预算与周期暂不设约束，当前不能形成有日期和资源承诺的生产预测。
    evidence_refs:
    - stmt:veilfront-xiangqi-siege:platform-engine
    - stmt:veilfront-xiangqi-siege:scope-constraints
    impact: medium
    staffing_implication: 可以按能力覆盖设计职责，但不能把组织建议解读为已批准人数、成本或交付日期。
  - risk_id: risk:veilfront-xiangqi-siege:rules-complexity
    description: 迷雾、独立城墙阶段、棋子特殊能力、随机炮击、强制撤回和多重胜利条件叠加，容易出现结算顺序歧义与状态组合缺陷。
    evidence_refs:
    - stmt:veilfront-xiangqi-siege:phase-gameplay
    - stmt:veilfront-xiangqi-siege:wall-cycle
    - stmt:veilfront-xiangqi-siege:victory-and-flags
    impact: high
    staffing_implication: 需要独立的规则规格、确定性测试矩阵与可复现对局证据，不能只依靠手工试玩验收。
  - risk_id: risk:veilfront-xiangqi-siege:hidden-information
    description: 合法落点提示、镜头、音效、小地图、炮架判定或网络同步都可能无意泄露迷雾内信息。
    evidence_refs:
    - stmt:veilfront-xiangqi-siege:board-and-fog
    - stmt:veilfront-xiangqi-siege:presentation
    - stmt:veilfront-xiangqi-siege:implementation
    impact: high
    staffing_implication: 需要从规则、客户端表现、网络协议与QA四个角度独立验收信息边界。
  - risk_id: risk:veilfront-xiangqi-siege:balance
    description: 兵卒穿敌长距离机动、马的隐身与区域内无蹩腿、车的路径多目标歼灭及远程随机炮击可能压缩其他棋子的战略价值，或放大先手和随机优势。
    evidence_refs:
    - stmt:veilfront-xiangqi-siege:phase-gameplay
    - stmt:veilfront-xiangqi-siege:horse-elephant-rules
    - stmt:veilfront-xiangqi-siege:cannon-rules
    - stmt:veilfront-xiangqi-siege:rook-rules
    - stmt:veilfront-xiangqi-siege:pawn-rules
    impact: medium
    staffing_implication: 需要可观测的平衡指标、对局日志、批量模拟或结构化试玩，不应在纸面阶段宣布平衡完成。
  - risk_id: risk:veilfront-xiangqi-siege:art-unknown
    description: 2D俯视与角色化单位路线已经确定，但资产精度、色彩语言、角色比例、动画、音频和修仙元素的具体视觉强度仍未形成美术基线。
    evidence_refs:
    - stmt:veilfront-xiangqi-siege:visual-direction
    impact: medium
    staffing_implication: 可以建立视觉方向与资产管线职责，但具体产能和外包需求要等待美术基线。
  - risk_id: risk:veilfront-xiangqi-siege:ai-fairness
    description: 战争迷雾下的机器人AI如果直接读取完整棋盘，会破坏侦察、隐身与欺骗玩法；若只读取可见信息，又需要处理不完全信息搜索与可解释难度。
    evidence_refs:
    - stmt:veilfront-xiangqi-siege:board-and-fog
    - stmt:veilfront-xiangqi-siege:single-player-ai
    impact: high
    staffing_implication: AI实现与QA必须共享明确的信息权限契约，并以可审计对局日志证明AI未读取隐藏状态。
  staffing_input:
    responsibility_needs:
    - need_id: need:veilfront-xiangqi-siege:rules-and-balance
      responsibility: 维护完整规则规格、状态转换、结算顺序、平衡目标与原型调参依据。
      rationale_statement_refs:
      - stmt:veilfront-xiangqi-siege:phase-gameplay
      - stmt:veilfront-xiangqi-siege:wall-cycle
      - stmt:veilfront-xiangqi-siege:victory-and-flags
      expected_artifacts:
      - 可执行规则规格
      - 状态机与结算顺序表
      - 平衡指标和试玩变更记录
      acceptance_owner_kind: human
    - need_id: need:veilfront-xiangqi-siege:godot-technology
      responsibility: 负责Godot工程结构、确定性规则核心、场景与资源映射、存档回放以及批准模式所需的联网或AI能力。
      rationale_statement_refs:
      - stmt:veilfront-xiangqi-siege:implementation
      - stmt:veilfront-xiangqi-siege:godot-authoring
      - stmt:veilfront-xiangqi-siege:platform-engine
      expected_artifacts:
      - 技术方案与Godot场景资源映射
      - 可运行原型和构建产物
      - 确定性、重连或回放验证证据
      acceptance_owner_kind: human
    - need_id: need:veilfront-xiangqi-siege:information-ux
