  - risk_id: risk:veilfront-xiangqi-siege:art-unknown
    description: 2D俯视与角色化单位路线已经确定，但资产精度、色彩语言、角色比例、动画、音频和修仙元素的具体视觉强度仍未形成美术基线。
    evidence_refs:
    - stmt:veilfront-xiangqi-siege:visual-direction
    impact: medium
    staffing_implication: 可以建立视觉方向与资产管线职责，但具体产能和外包需求要等待美术基线。
  - risk_id: risk:veilfront-xiangqi-siege:ai-fairness
    description: 战争迷雾下的机器人AI如果直接读取完整棋盘，会破坏侦察、隐身与欺骗玩法；若只读取可见信息，又需要处理不完全信息搜索与可解释难度。
    evidence_refs:
